    // 分析圖片色彩：X 光片是灰階影像，彩色照片多半是拍錯張（例如拍到傷口或人）
    function analyzeXrayImage(img) {
      const canvas = document.createElement("canvas");
      const size = 160;
      const ratio = Math.min(size / img.naturalWidth, size / img.naturalHeight, 1);
      canvas.width = Math.max(1, Math.round(img.naturalWidth * ratio));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * ratio));
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let satSum = 0, lumSum = 0, lumSqSum = 0, n = 0;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        satSum += max === 0 ? 0 : (max - min) / max;
        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        lumSum += lum; lumSqSum += lum * lum; n++;
      }
      const saturation = satSum / n;
      const mean = lumSum / n;
      const contrast = Math.sqrt(Math.max(lumSqSum / n - mean * mean, 0));
      return {
        width: img.naturalWidth,
        height: img.naturalHeight,
        isGrayscale: saturation < 0.12,
        lowContrast: contrast < 25,
        tooSmall: img.naturalWidth < 400 || img.naturalHeight < 400
      };
    }

    function todayKey(d = new Date()) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    // 匯出成行事曆檔（.ics）：網頁關掉就無法跳提醒，匯入手機行事曆後即使沒開網頁也會準時通知
    function buildReminderIcs(reminders) {
      const byday = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
      const now = new Date();
      const stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
      const start = todayKey(now).replace(/-/g, "");
      const esc = (t) => String(t || "").replace(/\\/g, "\\\\").replace(/[,;]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
      const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Ortho Smart Triage//Reminders//ZH-TW", "CALSCALE:GREGORIAN"];
      for (const r of reminders) {
        if (!r.enabled || !r.days.length) continue;
        const [hh, mm] = r.time.split(":");
        const label = r.type === "med" ? "💊 用藥" : "🏃 復健";
        lines.push(
          "BEGIN:VEVENT",
          `UID:${r.id}@ortho-triage`,
          `DTSTAMP:${stamp}`,
          `DTSTART:${start}T${hh}${mm}00`,
          "DURATION:PT15M",
          `RRULE:FREQ=WEEKLY;BYDAY=${r.days.map((d) => byday[d]).join(",")}`,
          `SUMMARY:${esc(`${label}：${r.title}`)}`,
          `DESCRIPTION:${esc(r.note || "")}`,
          "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc(r.title)}`, "TRIGGER:PT0M", "END:VALARM",
          "END:VEVENT"
        );
      }
      lines.push("END:VCALENDAR");
      return lines.join("\r\n");
    }

        { key: "duration", q: "這個情況持續多久了？" },
        { key: "severity", q: "症狀是否已經影響日常生活或工作？" }
      ] }
    };

    const INITIAL_PROMPT = "請說：我要掛號，或直接說出／輸入骨骼關節不舒服的部位（如：肩膀、膝蓋、腰）";
    const VOICE_FAIL_THRESHOLD = 2; // 連續辨識失敗達這個次數，自動切換成文字輸入

    function normalizeSpeechText(s) {
      if (!s) return "";
      return s.replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xff10 + 48))
              .replace(/[，、；]/g, " ")
              .replace(/\s+/g, " ")
              .trim();
    }

    // 骨科常見語音辨識誤判修正表（可依實際測試結果持續補充）
    const ASR_CORRECTIONS = [
      [/腕隧道症後群|完隧道症候群|腕隧道症侯群/g, "腕隧道症候群"],
      [/退化性關節言|退化性關節眼|退化性關結炎/g, "退化性關節炎"],
      [/寬關節/g, "髖關節"],
      [/足低筋膜炎|足底筋膜言/g, "足底筋膜炎"],
      [/骨質酥鬆/g, "骨質疏鬆"],
      [/坐骨神經通/g, "坐骨神經痛"],
      [/脊追|脊錐/g, "脊椎"],
      [/媽媽首/g, "媽媽手"]
    ];

    function correctMedicalTerms(text) {
      if (!text) return text;
      return ASR_CORRECTIONS.reduce((acc, [pattern, replacement]) => acc.replace(pattern, replacement), text);
    }

    // 外部 Google Apps Script：僅作為背景「補充建議」，不參與問診流程本身，
    // 也絕不覆蓋本地規則引擎算出的次專科結果（見 handleIncomingText 的說明）。
    // 加上逾時，避免它拖慢或卡住問診。
    const GAS_TIMEOUT_MS = 3000;

    async function callLobsterBackend(userText, currentState, history) {
      const gasUrl = "https://script.google.com/macros/s/AKfycbyim9_kVincHBae-Xf7In47jZwMyZmoChXH0EqMs6qnaVO-p6cRPjnp7Q18mYoeQk6qPg/exec";
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), GAS_TIMEOUT_MS);
      try {
        const res = await fetch(gasUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ message: userText, state: currentState, history: history }),
          signal: controller.signal
        });
        const data = await res.json();
        return data;
      } catch (e) {
        console.warn("外部 AI 補充建議取得失敗（不影響問診本身）：", e);
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    function parsePatientInfoFromSpeech(raw) {
      const t = normalizeSpeechText(raw);
      const out = { name: "", idNumber: "", birth: "", phone: "" };
      if (!t) return out;

      const compact = t.replace(/[\s，、；,\.\-\/]/g, "");
      const idM = compact.match(/([A-Za-z][12]\d{8})/i);
      if (idM) out.idNumber = idM[1].toUpperCase();

      const phM = compact.match(/09\d{8}/);
      if (phM) out.phone = phM[0];

      const roc = t.match(/民國\s*(\d{2,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);
      if (roc) {
        const y = parseInt(roc[1], 10) + 1911;
        out.birth = `${y}/${String(roc[2]).padStart(2, "0")}/${String(roc[3]).padStart(2, "0")}`;
      } else {
        const west = t.match(/(\d{4})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日?/) || t.match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
        if (west) {
          out.birth = `${west[1]}/${String(west[2]).padStart(2, "0")}/${String(west[3]).padStart(2, "0")}`;
        }
      }

      let nm = t.match(/(?:姓名|名字)[:：\s]*([一-鿿·．]{2,8})(?=\s|$|身分|電話|手機|出生|生日|病歷|[A-Za-z]|09|\d{4}|年)/) ||
               t.match(/我(?:叫|是|姓名是)[:：\s]*([一-鿿·．]{2,8})/);
      if (nm) out.name = nm[1].replace(/[·．]/g, "").trim();

      return out;
    }

      useEffect(() => {

          const now = new Date();

          const dayKey = todayKey(now);
          const doneToday = reminderDone[dayKey] || [];
          for (const r of reminders) {

      function speak(message) {
        if (!window.speechSynthesis) return;
        // 語音播報失敗（例如部分 App 內建瀏覽器不支援）不能讓整個畫面當掉，失敗就安靜略過
        try {
          const utterance = new SpeechSynthesisUtterance(message);
          utterance.lang = "zh-TW";
          speechSynthesis.cancel();
          speechSynthesis.speak(utterance);
        } catch (e) {
          console.warn("語音播報失敗：", e);
        }
      }

      function startRecord() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return alert("瀏覽器不支援");
        const rec = new SR();
        rec.lang = "zh-TW";
        rec.onresult = (e) => {
          const transcript = correctMedicalTerms(e.results[0][0].transcript);
          setInputValue(transcript);
          setVoiceFailCount(0);
          speak("已辨識完成，請確認內容後按送出。");
        };
        rec.onend = () => setRecording(false);
        rec.onerror = () => {
          setRecording(false);
          setVoiceFailCount((prev) => {
            const next = prev + 1;
            if (next >= VOICE_FAIL_THRESHOLD) {
              speak("連續辨識失敗，已為您切換成文字輸入，請直接打字描述。");
              textInputRef.current?.focus();
            } else {
              speak("沒有聽清楚，請再試一次，或改用文字輸入。");
            }
            return next;
          });
        };
        rec.start();
        setRecording(true);
      }

      function stopRecord() { setRecording(false); }

      function startPatientInfoRecord() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

        const rec = new SR();
        rec.lang = "zh-TW";
        rec.interimResults = false;

      function detectPart(content) {
        if (content.includes("小孩") || content.includes("兒童") || content.includes("小朋友") || content.includes("O型腿") || content.includes("X型腿") || content.includes("扁平足") || content.includes("斜頸") || content.includes("生長痛")) return "兒童";
        if (content.includes("腫塊") || content.includes("腫瘤") || content.includes("骨癌") || content.includes("骨髓炎")) return "腫瘤";
        if (content.includes("高壓氧") || content.includes("一氧化碳中毒") || content.includes("放射性骨壞死")) return "高壓氧";
        if (content.includes("脖子") || content.includes("頸") || content.includes("落枕")) return "頸椎";
        if (content.includes("腰") || content.includes("下背") || content.includes("坐骨神經")) return "腰椎";
        if (content.includes("肩") || content.includes("五十肩")) return "肩關節";
        if (content.includes("手肘") || content.includes("手腕") || content.includes("手指") || content.includes("媽媽手") || content.includes("腕隧道") || content.includes("手")) return "肘腕";
        if (content.includes("髖") || content.includes("鼠蹊") || content.includes("大腿根")) return "髖關節";
        if (content.includes("膝") || content.includes("退化性關節炎")) return "膝關節";
        if (content.includes("腳踝") || content.includes("足底") || content.includes("腳跟") || content.includes("扭傷") || content.includes("腳")) return "足踝";
        if (content.includes("骨折") || content.includes("車禍") || content.includes("跌倒") || content.includes("外傷") || content.includes("撞擊")) return "外傷";
        return "未明";
      }

      function extractKeySymptoms(text) {
        if (!text) return "";
        const keywords = [
          "頸椎痛", "腰痛", "下背痛", "坐骨神經痛", "肩痛", "五十肩", "手肘痛", "手腕痛",
          "媽媽手", "腕隧道症候群", "髖關節痛", "鼠蹊痛", "膝蓋痛", "退化性關節炎",
          "腳踝扭傷", "足底筋膜炎", "骨折", "骨質疏鬆", "關節腫脹", "麻木", "無力"
        ];
        const ignore = ["沒有", "不會", "還好", "一天", "兩天", "三天"];
        const words = text.split(/[\s；，,。]/);
        const result = words.filter(w => keywords.some(k => w.includes(k)) && !ignore.includes(w));
        return result.join(" ");
      }

      function hasDirectSymptomHint(content) {
        const t = (content || "").trim();
        if (!t) return false;
        const normalized = t.replace(/\s/g, "").replace(/[。．.，,、]/g, "");
        if (/^(我要)?掛號$/.test(normalized)) return false;
        if (t.includes("脖子") || t.includes("頸") || t.includes("落枕")) return true;
        if (t.includes("腰") || t.includes("下背") || t.includes("坐骨神經")) return true;
        if (t.includes("肩") || t.includes("五十肩")) return true;
        if (t.includes("手肘") || t.includes("手腕") || t.includes("手指") || t.includes("媽媽手") || t.includes("腕隧道")) return true;
        if (t.includes("髖") || t.includes("鼠蹊")) return true;
        if (t.includes("膝") || t.includes("退化性關節炎")) return true;
        if (t.includes("腳踝") || t.includes("足底") || t.includes("腳跟")) return true;
        if (t.includes("骨折") || t.includes("車禍") || t.includes("跌倒") || t.includes("外傷") || t.includes("撞擊")) return true;
        if (t.includes("小孩") || t.includes("兒童") || t.includes("小朋友") || t.includes("O型腿") || t.includes("X型腿") || t.includes("扁平足") || t.includes("斜頸") || t.includes("生長痛")) return true;
        if (t.includes("腫塊") || t.includes("腫瘤") || t.includes("骨癌") || t.includes("骨髓炎")) return true;
        if (t.includes("高壓氧") || t.includes("一氧化碳中毒") || t.includes("放射性骨壞死")) return true;
        return /(不舒服|難受|好痛|很痛|刺痛|悶痛|脹痛|酸痛|痠痛|麻|無力|腫脹|卡住|變形|瘀青)/.test(t);
      }

      // 直接說出「科別」或「醫師姓名」時，跳過問診直接帶出該門診（比照長庚可指定醫師掛號的做法）。
      // 只指名醫師時用該醫師的第一個擅長科別；只指名科別時 doctor 給 null，交給後端在整科找最快的醫師。
      function detectDoctorMention(content) {
        const t = (content || "").trim();
        if (!t) return null;
        for (const [doc, depts] of Object.entries(DOCTOR_DEPARTMENTS)) {
          if (t.includes(doc)) return { department: depts[0], doctor: doc };
        }
        for (const dept of DEPARTMENTS) {
          if (t.includes(dept)) return { department: dept, doctor: null };
        }
        return null;
      }

      // 判斷描述是否聽起來不是骨科問題。若同時提到骨骼關節相關字眼，
      // 優先照骨科流程走（避免漏掉合併症狀，例如關節腫痛合併發燒）。
      function detectNonOrthoConcern(content) {
        const t = (content || "").trim();
        if (!t || hasDirectSymptomHint(t)) return null;
        for (const entry of NON_ORTHO_SUGGESTIONS) {
          if (entry.keywords.some((k) => t.includes(k))) return entry.dept;
        }
        return null;
      }

      function checkEmergency(part, ans) {
        const joined = Object.values(ans).join(" ");
        if ((part === "頸椎" || part === "腰椎") && /(大小便失禁|下肢無力癱瘓|馬鞍區麻木|意識不清)/.test(joined)) {
          return "偵測到可能的脊髓或神經壓迫症狀（如大小便失禁、下肢無力），建議立即前往急診評估。";
        }
        if (part === "外傷" && /(骨頭外露|傷口大量出血|肢體發黑冰冷|摸不到脈搏|明顯變形)/.test(joined)) {
          return "偵測到嚴重外傷徵象，建議立即撥打 119 或前往急診。";
        }
        if ((part === "膝關節" || part === "髖關節" || part === "足踝") && /(完全無法承重|明顯變形|劇烈腫脹)/.test(joined)) {
          return "偵測到可能的骨折或嚴重關節損傷，建議盡快前往急診評估。";
        }
        if (/(高燒不退|發黑麻木)/.test(joined)) {
          return "偵測到較危急症狀，建議盡快就醫，必要時前往急診。";
        }
        if (part === "高壓氧" && /(意識不清|呼吸困難)/.test(joined)) {
          return "偵測到可能的一氧化碳中毒急症（意識不清、呼吸困難），請立即撥打119或前往急診。";
        }
        return "";
      }

      function calculate(part, ans) {
        const score = {
          脊椎外科: 30, 運動醫學科: 30, 關節重建科: 30, 手外科: 25,
          足踝外科: 25, 骨折創傷科: 25, 骨質疏鬆症門診: 20,
          兒童骨科: 20, 骨骼腫瘤科: 20, 高壓氧治療中心: 15
        };
        const joined = Object.values(ans).join(" ");
        if (part === "頸椎") {
          score["脊椎外科"] += 35;
          if (/麻|無力|延伸/.test(joined)) score["脊椎外科"] += 15;
        }
        if (part === "腰椎") {
          score["脊椎外科"] += 35;
          if (/麻|延伸|坐骨/.test(joined)) score["脊椎外科"] += 15;
          if (/骨鬆|骨質疏鬆|停經/.test(joined)) score["骨質疏鬆症門診"] += 15;
        }
        if (part === "肩關節") {
          score["運動醫學科"] += 30;
          if (/跌倒|運動|搬重物/.test(joined)) score["運動醫學科"] += 15;
          if (/夜間痛|卡住/.test(joined)) score["關節重建科"] += 10;
        }
        if (part === "肘腕") {
          score["手外科"] += 35;
          if (/重複性動作|媽媽手|腕隧道/.test(joined)) score["手外科"] += 15;
          if (/跌倒|扭傷/.test(joined)) score["骨折創傷科"] += 10;
        }
        if (part === "髖關節") {
          score["關節重建科"] += 30;
          if (/退化|走路|樓梯/.test(joined)) score["關節重建科"] += 15;
        }
        if (part === "膝關節") {
          score["關節重建科"] += 30;
          if (/運動|扭傷/.test(joined)) score["運動醫學科"] += 15;
          if (/腫脹|發熱|無法伸直/.test(joined)) score["關節重建科"] += 10;
        }
        if (part === "足踝") {
          score["足踝外科"] += 35;
          if (/扭傷|運動/.test(joined)) score["運動醫學科"] += 10;
        }
        if (part === "外傷") {
          score["骨折創傷科"] += 40;
          if (/變形|傷口|骨頭外露/.test(joined)) score["骨折創傷科"] += 20;
        }
        if (part === "兒童") {
          score["兒童骨科"] += 45;
          if (/跌倒|運動|受傷/.test(joined)) score["骨折創傷科"] += 10;
        }
        if (part === "腫瘤") {
          score["骨骼腫瘤科"] += 45;
          if (/變大|體重下降|疼痛/.test(joined)) score["骨骼腫瘤科"] += 15;
        }
        if (part === "高壓氧") {
          score["高壓氧治療中心"] += 45;
        }
        if (part === "未明") {
          score["脊椎外科"] += 10; score["關節重建科"] += 10; score["運動醫學科"] += 10;
          if (/腰|背/.test(joined)) score["脊椎外科"] += 15;
          if (/膝|髖/.test(joined)) score["關節重建科"] += 15;
          if (/骨鬆|骨質疏鬆/.test(joined)) score["骨質疏鬆症門診"] += 20;
        }
        return Object.entries(score).sort((a, b) => b[1] - a[1]).slice(0, 3);
      }

      async function callRAG(question, metadata = {}) {
        setRagLoading(true); setRagError(""); setRagAnswer(""); setRagChunks([]);
        try {
          const res = await fetch(`${API_BASE}/rag/answer`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, top_k: 3, metadata })
          });
          const data = await res.json();
          setRagAnswer(data.answer || "");
          setRagChunks(Array.isArray(data.retrieved_chunks) ? data.retrieved_chunks : []);
        } catch (err) {
          console.error("RAG 錯誤：", err);
          setRagError("RAG 連線失敗，請確認本機後端是否啟動。");
        } finally {
          setRagLoading(false);
        }
      }

      function analyzeSymptom(symptomText) {
        if (!symptomText) return;
        setExternalHint("");
        if (symptomText === "症狀不明確") {
          setBodyPart("未明"); setQaStep(0); setAnswers({ mainComplaint: symptomText });
          const firstQuestion = symptomDB["未明"].questions[0].q;
          setPrompt(firstQuestion); speak(firstQuestion); setState(STATES.QA);
          return;
        }
        const part = detectPart(symptomText);
        setBodyPart(part); setQaStep(0); setAnswers({ mainComplaint: symptomText });
        const safePart = symptomDB[part] ? part : "未明";
        if (safePart !== part) setBodyPart("未明");
        const firstQuestion = symptomDB[safePart].questions[0].q;
        setPrompt(firstQuestion); speak(firstQuestion); setState(STATES.QA);
      }

      function applyDirectDoctorSelection({ department, doctor }) {
        setExternalHint("");
        setPreferredDoctor(doctor || null);
        setResult([[department, 100]]);
        const msg = doctor
          ? `正在為您查詢 ${doctor}（${department}）最接近的門診時段...`
          : `正在為您查詢 ${department} 最接近的門診時段...`;
        setPrompt(msg); speak(msg);
        setState(STATES.RESULT);
      }

      function showNonOrthoSuggestion(dept, originalText) {
        setNonOrthoDept(dept);
        setNonOrthoText(originalText);
        const msg = `您描述的症狀聽起來可能不是骨科問題，建議優先考慮掛「${dept}」門診評估。`;
        setPrompt(msg); speak(msg);

      }

      // ---------- X 光辨識器 ----------
      function handleXrayFile(e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file) return;
        if (!file.type.startsWith("image/")) { alert("請上傳圖片檔（JPG、PNG 等）。"); return; }
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let check = null;
          try { check = analyzeXrayImage(img); } catch (err) { console.warn("圖片分析失敗", err); }
          setXrayImage({ url, name: file.name, check });
          setXrayView({ brightness: 100, contrast: 100, invert: false, zoom: 1 });
          if (check && !check.isGrayscale) speak("這張圖片看起來是彩色照片，不像 X 光片，請確認是否上傳正確。");
          else speak("X 光片已載入，請選擇拍攝部位。");
        };
        img.onerror = () => { URL.revokeObjectURL(url); alert("圖片讀取失敗，請換一張再試。"); };
        img.src = url;
      }

      function bookFromXray() {
        const department = XRAY_PARTS[xrayPart];
        if (!department) { alert("請先選擇 X 光拍攝部位。"); return; }
        setIsDirectBooking(false);
        applyDirectDoctorSelection({ department, doctor: null });
      }

      // ---------- 復健／用藥提醒 ----------
      function addReminder(preset) {
        const form = preset || reminderForm;
        const title = (form.title || "").trim();
        if (!title) { alert(form.type === "med" ? "請輸入藥名，例如：止痛藥 1 顆" : "請輸入復健項目，例如：直膝抬腿 3 組"); return false; }
        if (!/^\d{2}:\d{2}$/.test(form.time)) { alert("請選擇提醒時間。"); return false; }
        if (!form.days.length) { alert("請至少選擇一天。"); return false; }
        const item = { id: `r${Date.now()}${Math.random().toString(36).slice(2, 6)}`, type: form.type, title, time: form.time, days: [...form.days].sort(), note: (form.note || "").trim(), enabled: true };
        setReminders((prev) => [...prev, item].sort((a, b) => a.time.localeCompare(b.time)));
        if (!preset) setReminderForm((prev) => ({ ...prev, title: "", note: "" }));
        return true;
      }

      function toggleFormDay(day) {
        setReminderForm((prev) => ({ ...prev, days: prev.days.includes(day) ? prev.days.filter((d) => d !== day) : [...prev.days, day] }));
      }

      function toggleReminderEnabled(id) {
        setReminders((prev) => prev.map((r) => (r.id === id ? { ...r, enabled: !r.enabled } : r)));
      }

      function deleteReminder(id) {
        if (!window.confirm("確定要刪除這個提醒嗎？")) return;
        setReminders((prev) => prev.filter((r) => r.id !== id));
      }

      function toggleReminderDone(id) {
        const key = todayKey();
        setReminderDone((prev) => {
          const today = prev[key] || [];
          const nextToday = today.includes(id) ? today.filter((x) => x !== id) : [...today, id];
          // 只保留最近 14 天的打勾紀錄，避免 localStorage 越存越多
          const keep = Object.keys(prev).sort().slice(-13).filter((k) => k !== key);
          const next = {};
          for (const k of keep) next[k] = prev[k];
          next[key] = nextToday;
          return next;
        });
        if (activeReminder?.id === id) setActiveReminder(null);
      }

      async function requestNotifyPermission() {
        if (typeof Notification === "undefined") { alert("這個瀏覽器不支援系統通知，提醒時會改用畫面跳出＋語音播報。"); return; }
        const result = await Notification.requestPermission();
        setNotifyPermission(result);
        if (result === "granted") speak("已開啟通知，提醒時間到會跳出通知。");
      }

      function downloadReminderIcs() {
        const active = reminders.filter((r) => r.enabled);
        if (!active.length) { alert("目前沒有啟用中的提醒可以匯出。"); return; }
        const blob = new Blob([buildReminderIcs(active)], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "骨科復健用藥提醒.ics";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function addRehabReminder(exercise) {
        const ok = addReminder({ type: "rehab", title: exercise.name, time: "20:00", days: [0, 1, 2, 3, 4, 5, 6], note: exercise.reps });
        if (ok) setToast(`已加入每天 20:00 的復健提醒：${exercise.name}（可到「復健／用藥提醒」修改）`);
      }

      // 背景取得外部 AI（Google Apps Script）的補充建議，全程不 await、不阻塞問診，
      // 也絕不用它的結果去改變 state／department／booking，避免重演之前「蓋掉本地
      // 正確次專科判斷」跟「拖慢問診」的問題，只拿它的文字當作額外參考顯示。
      function fetchExternalHint(userText, currentState, hist) {
        const updatedHistory = [...hist, { role: "user", content: userText }];
        setChatHistory(updatedHistory);
        callLobsterBackend(userText, currentState, updatedHistory).then((aiResponse) => {
          if (!aiResponse || !aiResponse.reply) return;
          setChatHistory((prev) => [...prev, { role: "assistant", content: aiResponse.reply }]);
          setExternalHint(aiResponse.reply);
        });
      }

      function handleIncomingText(rawText) {
        const incoming = (rawText || "").trim();
        if (!incoming) return;
        setInputValue("");
        const latest = latestRef.current;
        const { state: s, bodyPart: bp, qaStep: step, answers: ans, chatHistory: hist } = latest;

        fetchExternalHint(incoming, s, hist);

        if (s === STATES.INIT) {
          const doctorMatch = detectDoctorMention(incoming);
          if (doctorMatch) { applyDirectDoctorSelection(doctorMatch); return; }
          const nonOrthoDeptMatch = detectNonOrthoConcern(incoming);
          if (nonOrthoDeptMatch) { showNonOrthoSuggestion(nonOrthoDeptMatch, incoming); return; }
          if (incoming.includes("掛號") || incoming.length > 0) {
            if (hasDirectSymptomHint(incoming)) { analyzeSymptom(incoming); }
            else {
              setPrompt("請選擇不舒服的骨骼關節部位，或直接描述症狀"); speak("請選擇不舒服的骨骼關節部位，或直接描述症狀"); setState(STATES.SELECT_BODY_PART);
            }
          }
          return;
        }

        if (s === STATES.SELECT_BODY_PART) {
          const doctorMatch = detectDoctorMention(incoming);
          if (doctorMatch) { applyDirectDoctorSelection(doctorMatch); return; }
          const nonOrthoDeptMatch = detectNonOrthoConcern(incoming);
          if (nonOrthoDeptMatch) { showNonOrthoSuggestion(nonOrthoDeptMatch, incoming); return; }
          analyzeSymptom(incoming); return;
        }

        if (s === STATES.QA) {
          const currentQuestion = symptomDB[bp]?.questions?.[step];
          if (!currentQuestion) return;
          const newAnswers = { ...ans, [currentQuestion.key]: incoming };
          setAnswers(newAnswers);
          const emergency = checkEmergency(bp, newAnswers);
          if (emergency) {
            setAlertMessage(emergency); setState(STATES.ALERT);
            setPrompt("系統偵測到較危急症狀"); speak("系統偵測到較危急症狀，請盡快就醫"); return;
          }
          const questions = symptomDB[bp]?.questions || [];
          if (step + 1 < questions.length) {
            const nextStep = step + 1; setQaStep(nextStep);
            const nextQuestion = questions[nextStep].q; setPrompt(nextQuestion); speak(nextQuestion);
          } else {
            const calculated = calculate(bp, newAnswers);
            const topDept = calculated[0][0];
            setResult(calculated);
            setPreferredDoctor(null); // 交給後端在整個科別裡找最快的醫師
            setPrompt("已完成初步分流分析，正在為您查詢最快的門診時段..."); speak("已完成初步分流分析"); setState(STATES.RESULT);
            callRAG(newAnswers.mainComplaint, { body_part: bp, recommended_department: topDept });
          }
        }
      }

      useEffect(() => {
        if (!text) return;
        handleIncomingText(text);
        setText("");
      }, [text]);

      // 問診中點擊「上一步」的處理邏輯
      function goBackQa() {
        const { bodyPart: bp, qaStep: step, answers: ans } = latestRef.current;
        const questions = symptomDB[bp]?.questions || [];
        const msg = "請選擇不舒服的骨骼關節部位，或直接描述症狀";

        // 如果已經是第一題，再按上一步就退回到「選擇部位」頁面
        if (!questions.length || step <= 0) {
          setState(STATES.SELECT_BODY_PART);
          setPrompt(msg);
          speak(msg);
          setLastInputEcho("");
          setInputValue("");
          return;
        }

        // 回到上一題，並移除剛才回答過的那一題數據
        const nextStep = step - 1;
        const keysToDrop = questions.slice(nextStep + 1).map((q) => q.key);
        const newAnswers = { ...ans };
        for (const k of keysToDrop) delete newAnswers[k];

        setAnswers(newAnswers);
        setQaStep(nextStep);

        const prevQuestion = questions[nextStep].q;
        const prevKey = questions[nextStep].key;
        const prevAnswer = newAnswers?.[prevKey] || "";

        setPrompt(prevQuestion);
        speak(prevQuestion);
        setLastInputEcho(prevAnswer || "");
        setInputValue(prevAnswer);
      }

      function renderQaProgress() {
        const questions = symptomDB[bodyPart]?.questions || [];
        if (!questions.length) return null;
        const total = questions.length; const current = Math.min(qaStep + 1, total); const pct = Math.round((current / total) * 100);
        return (
          <div className="qa-topbar">
            <div className="qa-meta">
              <div className="qa-steps">第 {current}/{total} 題</div>
              <div className="qa-bar" aria-hidden="true"><div className="qa-bar-fill" style={{ width: `${pct}%` }} /></div>
            </div>
            <button type="button" className="ghost-btn" onClick={goBackQa}>上一步</button>
          </div>
        );
      }

      function renderQuickOptions() {
        if (state !== STATES.QA) return null;
        const questions = symptomDB[bodyPart]?.questions || [];
        const currentQ = questions[qaStep];
        if (!currentQ || currentQ.key !== "duration") return null;
        const options = ["一天", "兩天", "三天", "一週", "大於一週"];
        return (
          <div className="option-row" aria-label="快捷選項">
            {options.map((opt) => (<button key={opt} type="button" className="option-btn" onClick={() => submitQuickOption(opt)}>{opt}</button>))}
          </div>
        );
      }

      async function confirmBookingAll() {
        const { name, idNumber, birth, phone } = patientInfo;
        if (!name || !idNumber || !birth || !phone) { alert("請完整填寫姓名、身分證字號、生日與手機。"); return; }
        setIsSubmittingBooking(true);
        try {
          const response = await fetch(`${API_BASE}/api/booking/confirm`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: patientInfo.name,
              id_number: patientInfo.idNumber,
              department: booking.department,
              doctor: booking.doctor,
              slot: `${booking.date} ${booking.slot}`,
              birth_date: patientInfo.birth,
              phone: patientInfo.phone,
              body_part: bodyPart || null,
              main_complaint: answers.mainComplaint || null,
              qa_answers: Object.keys(answers).length > 0 ? answers : null,
              ai_suggestion: ragAnswer || null
            })
          });
          const data = await response.json();
          if (response.ok && data.status === "success") {
            speak(`掛號成功，AI 已為您預約 ${booking.date} ${booking.slot} 的 ${booking.department}。`);
            setState(STATES.COMPLETE);

      function renderScheduleGrid(schedule, loading, error, onPick, doctorFilter, highlight) {
        if (loading) return <div className="rag-loading">班表查詢中...</div>;
        if (error) return <div className="rag-error">{error}</div>;
        if (!schedule) return null;
        return (
          <div className="schedule-days">
            {schedule.days.map((day) => {
              const daySlots = doctorFilter ? day.slots.filter((s) => s.doctor === doctorFilter) : day.slots;
              return (
                <div className="schedule-day" key={day.date}>
                  <div className="schedule-day-header">{day.date}（星期{day.weekday}）</div>
                  {daySlots.length === 0 ? (
                    <div className="schedule-day-empty">本日無門診</div>
                  ) : (
                    <div className="schedule-day-slots">
                      {daySlots.map((slot) => {
                        const isActive = highlight && highlight.doctor === slot.doctor && highlight.date === day.date && highlight.slot === slot.time_slot;
                        return (
                          <button
                            type="button"
                            key={`${slot.doctor}-${slot.session}`}
                            className={`schedule-slot-btn ${slot.full ? "full" : ""} ${isActive ? "active" : ""}`}
                            disabled={slot.full}
                            onClick={() => onPick(slot.doctor, day.date, slot.time_slot)}
                          >
                            <span className="schedule-slot-doctor">{slot.doctor}</span>
                            <span className="schedule-slot-session">{slot.session}</span>
                            <span className="schedule-slot-remaining">{slot.full ? "已額滿" : `剩 ${slot.remaining} 位`}</span>
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      }

      function renderCheckHistory() {
        const handleSearch = async () => {
          if (!searchId.trim()) {
            alert("請輸入身分證字號");
            return;
          }
          setIsSearching(true);
          try {
            const response = await fetch(`${API_BASE}/api/booking/history`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id_number: searchId.trim() })
            });
            const data = await response.json();
            if (data.status === "success") {
              setHistoryList(data.data);
              setLastVisit(data.last_visit || null);
              setRescheduleTarget(null);
              if (data.data.length === 0) {
                speak("查無掛號紀錄。");
              } else {
                speak(`為您找到 ${data.data.length} 筆紀錄。`);
              }
            } else {
              alert("查詢失敗：" + data.message);
            }
          } catch (err) {
            console.error("查詢 API 呼叫失敗", err);
            alert("連線後端失敗，請確認伺服器已啟動。");
          } finally {
            setIsSearching(false);
          }
        };

        const handleCancel = async (item) => {
          if (!window.confirm(`確定要取消 ${item.slot} ${item.doctor} 的掛號嗎？`)) return;
          setActionLoading(item.appointment_no);
          try {
            const response = await fetch(`${API_BASE}/api/booking/cancel`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id_number: searchId.trim(), appointment_no: item.appointment_no })
            });
            const data = await response.json();
            if (data.status === "success") {
              speak(data.message);
              setHistoryList((prev) => prev.map((h) => h.appointment_no === item.appointment_no ? { ...h, status: "cancelled" } : h));
            } else {
              alert("取消失敗：" + data.message);
            }
          } catch (err) {
            console.error("取消掛號 API 呼叫失敗", err);
            alert("連線後端失敗，請確認伺服器已啟動。");
          } finally {
            setActionLoading(null);
          }
        };

        const openReschedule = (item) => {
          setRescheduleTarget(item.appointment_no);
          setRescheduleDate(""); setRescheduleSlot("");
          setRescheduleDoctor(item.doctor); setRescheduleAnyDoctor(false);
          setRescheduleSchedule(null); setRescheduleScheduleError("");
          setRescheduleScheduleLoading(true);
          fetchDepartmentSchedule(item.department)
            .then((data) => {
              if (data.status === "success") setRescheduleSchedule(data);
              else setRescheduleScheduleError(data.message || "查詢班表失敗");
            })
            .catch(() => setRescheduleScheduleError("查詢班表失敗，請確認後端（uvicorn）是否已啟動。"))
            .finally(() => setRescheduleScheduleLoading(false));
        };

        const confirmReschedule = async (item) => {
          setActionLoading(item.appointment_no);
          try {
            const newSlot = `${rescheduleDate} ${rescheduleSlot}`;
            const newDoctor = rescheduleDoctor || item.doctor;
            const response = await fetch(`${API_BASE}/api/booking/reschedule`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                id_number: searchId.trim(),
                appointment_no: item.appointment_no,
                new_slot: newSlot,
                ...(newDoctor !== item.doctor ? { new_doctor: newDoctor } : {})
              })
            });
            const data = await response.json();
            if (data.status === "success") {
              speak(data.message);
              setHistoryList((prev) => prev.map((h) => h.appointment_no === item.appointment_no
                ? { ...h, slot: newSlot, appointment_date: rescheduleDate, time_slot: rescheduleSlot, doctor: newDoctor }
                : h));
              setRescheduleTarget(null);
            } else {
              alert("改期失敗：" + data.message);
            }
          } catch (err) {
            console.error("改期 API 呼叫失敗", err);
            alert("連線後端失敗，請確認伺服器已啟動。");
          } finally {
            setActionLoading(null);
          }
        };

        const submitContactUpdate = async () => {
          const birth = contactForm.birth.trim();
          const phone = contactForm.phone.trim();
          if (!birth || !phone) { alert("請填寫生日與新的手機號碼。"); return; }
          if (!/^09\d{8}$/.test(phone)) { alert("手機格式不正確，需為 09 開頭的 10 位數字。"); return; }
          setContactForm((prev) => ({ ...prev, loading: true }));
          try {
            const response = await fetch(`${API_BASE}/api/patient/update`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id_number: searchId.trim(), birth_date: birth, phone })
            });
            const data = await response.json();
            if (response.ok && data.status === "success") {
              speak(data.message);
              setToast(data.message);
              setContactForm({ open: false, birth: "", phone: "", loading: false });
              return;
            }
            const msg = data.message || (Array.isArray(data.detail) ? data.detail.map((d) => d.msg).join("；") : data.detail) || "請稍後再試。";
            alert("修改失敗：" + msg);
          } catch (err) {
            console.error("修改聯絡資料 API 呼叫失敗", err);
            alert("連線後端失敗，請確認伺服器已啟動。");
          }
          setContactForm((prev) => ({ ...prev, loading: false }));
        };

        const renderLastVisit = () => {
          if (!lastVisit) return null;
          const rehabPart = rehabPartOf(lastVisit.body_part);
          return (
            <div className="last-visit-card">
              <div className="last-visit-badge">🗂 上次就診紀錄</div>
              <div className="ai-booking-row"><span>看診日期</span><strong>{lastVisit.slot}</strong></div>
              <div className="ai-booking-row"><span>科別／醫師</span><strong>{lastVisit.department}．{lastVisit.doctor}</strong></div>
              {lastVisit.body_part ? <div className="ai-booking-row"><span>不適部位</span><strong>{lastVisit.body_part}</strong></div> : null}
              {lastVisit.main_complaint ? <div className="ai-booking-row"><span>當時主訴</span><strong>{lastVisit.main_complaint}</strong></div> : null}
              {lastVisit.ai_suggestion ? <p className="last-visit-note">AI 建議：{lastVisit.ai_suggestion}</p> : null}
              <div className="last-visit-actions">
                <button type="button" className="mini-btn" onClick={() => applyDirectDoctorSelection({ department: lastVisit.department, doctor: lastVisit.doctor })}>
                  🔁 再掛一次{lastVisit.doctor}（回診）
                </button>
                {rehabPart ? (
                  <button type="button" className="mini-btn" onClick={() => { setRehabPart(rehabPart); goToFeature(STATES.REHAB, `${rehabPart}的居家復健動作教學`); }}>
                    🎬 看{rehabPart}復健影片
                  </button>
                ) : null}
              </div>
            </div>
          );
        };

        return (
          <div className="form-card">
            <h3>就診紀錄／修改預約</h3>
            <label className="field-label">請輸入身分證字號</label>
            <div className="input-row">
              <input
                className="text-input"
                value={searchId}
                onChange={(e) => setSearchId(e.target.value.toUpperCase())}
                placeholder="例如：A123456789"
                onKeyDown={(e) => { if (e.key === "Enter") handleSearch(); }}
              />
              <button type="button" className="mini-btn" onClick={handleSearch} disabled={isSearching}>
                {isSearching ? "查詢中..." : "查詢"}
              </button>
            </div>

            {historyList !== null && historyList.length > 0 && !lastVisit ? (
              <p className="helper-text" style={{ marginTop: '16px' }}>目前還沒有已經看過診的紀錄（只有尚未到期的預約）。</p>
            ) : null}
            {historyList !== null ? renderLastVisit() : null}

            {historyList !== null && (
              <div style={{ marginTop: '20px' }}>
                <h4 style={{ borderBottom: '1px solid #eee', paddingBottom: '8px' }}>所有掛號紀錄</h4>
                {historyList.length === 0 ? (
                  <p style={{ color: '#666', textAlign: 'center', padding: '15px' }}>目前沒有您的掛號紀錄。</p>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {historyList.map((item, idx) => {
                      const isCancelled = item.status === "cancelled";
                      const isPast = !!item.is_past;
                      const isBusy = actionLoading === item.appointment_no;
                      return (
                        <div key={idx} style={{ padding: '12px', border: '1px solid #e0e0e0', borderRadius: '8px', backgroundColor: isCancelled ? '#f5f5f5' : '#f9f9f9', opacity: isCancelled ? 0.7 : 1 }}>
                          <p style={{ margin: '0 0 5px 0', fontWeight: 'bold', color: '#1976d2' }}>
                            {item.appointment_no ? `#${item.appointment_no} ` : ''}{item.department} - {item.doctor}
                            {isCancelled ? <span style={{ marginLeft: '8px', fontSize: '12px', color: '#c0392b', fontWeight: 'bold' }}>已取消</span> : null}
                            {!isCancelled && isPast ? <span style={{ marginLeft: '8px', fontSize: '12px', color: '#059669', fontWeight: 'bold' }}>已看診</span> : null}
                            {!isCancelled && !isPast ? <span style={{ marginLeft: '8px', fontSize: '12px', color: '#1d4ed8', fontWeight: 'bold' }}>即將看診</span> : null}
                          </p>
                          <p style={{ margin: '0 0 5px 0', fontSize: '14px' }}>看診時間：{item.slot}</p>
                          {item.main_complaint ? <p style={{ margin: '0 0 5px 0', fontSize: '13px', color: '#555' }}>主訴：{item.body_part ? `${item.body_part}／` : ''}{item.main_complaint}</p> : null}
                          <p style={{ margin: '0', fontSize: '12px', color: '#888' }}>預約者：{item.name} | 預約建立於：{item.created_at}</p>

                          {!isCancelled && !isPast ? (
                            <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                              <button type="button" className="mini-btn" style={{ margin: 0, flex: 1, backgroundColor: '#fff', color: '#1976d2', border: '1px solid #1976d2' }} onClick={() => openReschedule(item)} disabled={isBusy}>
                                改期
                              </button>
                              <button type="button" className="mini-btn" style={{ margin: 0, flex: 1, backgroundColor: '#fff', color: '#c0392b', border: '1px solid #c0392b' }} onClick={() => handleCancel(item)} disabled={isBusy}>
                                {isBusy ? "處理中..." : "取消掛號"}
                              </button>
                            </div>
                          ) : null}

                          {rescheduleTarget === item.appointment_no ? (
                            <div style={{ marginTop: '10px', padding: '10px', backgroundColor: '#fff', border: '1px dashed #1976d2', borderRadius: '8px' }}>
                              <label className="reschedule-toggle">
                                <input
                                  type="checkbox"
                                  checked={rescheduleAnyDoctor}
                                  onChange={(e) => {
                                    setRescheduleAnyDoctor(e.target.checked);
                                    setRescheduleDoctor(item.doctor); setRescheduleDate(""); setRescheduleSlot("");
                                  }}
                                />
                                也可以改掛{item.department}的其他醫師
                              </label>
                              <label className="field-label" style={{ display: 'block' }}>
                                {rescheduleAnyDoctor ? `${item.department}所有醫師` : item.doctor} 未來 7 天班表（點選新時段）
                              </label>
                              {renderScheduleGrid(
                                rescheduleSchedule, rescheduleScheduleLoading, rescheduleScheduleError,
                                (doc, date, slot) => { setRescheduleDoctor(doc); setRescheduleDate(date); setRescheduleSlot(slot); },
                                rescheduleAnyDoctor ? null : item.doctor,
                                { doctor: rescheduleDoctor, date: rescheduleDate, slot: rescheduleSlot }
                              )}
                              {rescheduleDate && rescheduleSlot ? (
                                <div style={{ fontSize: '13px', color: '#1976d2', margin: '10px 0', fontWeight: 'bold' }}>
                                  ✅ 已選擇：{rescheduleDoctor}．{rescheduleDate}．{rescheduleSlot}
                                  {rescheduleDoctor !== item.doctor ? `（由${item.doctor}改為${rescheduleDoctor}）` : ''}
                                </div>
                              ) : null}
                              <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
                                <button type="button" className="secondary-btn" style={{ margin: 0, flex: 1 }} onClick={() => setRescheduleTarget(null)}>取消</button>
                                <button type="button" className="mini-btn" style={{ margin: 0, flex: 1 }} onClick={() => confirmReschedule(item)} disabled={isBusy || !rescheduleDate || !rescheduleSlot}>
                                  {isBusy ? "處理中..." : "確認改期"}
                                </button>
                              </div>
                            </div>
                          ) : null}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {historyList !== null && historyList.length > 0 ? (
              <div className="contact-edit">
                {!contactForm.open ? (
                  <button type="button" className="ghost-btn" onClick={() => setContactForm((prev) => ({ ...prev, open: true }))}>📱 修改聯絡手機</button>
                ) : (
                  <>
                    <h4 style={{ margin: '0 0 4px' }}>修改聯絡手機</h4>
                    <p className="helper-text" style={{ margin: 0 }}>為保護個資，需輸入掛號時填寫的生日才能修改。</p>
                    <label className="field-label">生日</label>
                    <input className="text-input" value={contactForm.birth} placeholder="YYYY/MM/DD" onChange={(e) => setContactForm((prev) => ({ ...prev, birth: e.target.value }))} />
                    <label className="field-label">新的手機號碼</label>
                    <input className="text-input" value={contactForm.phone} placeholder="09xxxxxxxx" inputMode="numeric" onChange={(e) => setContactForm((prev) => ({ ...prev, phone: e.target.value.trim() }))} />
                    <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
                      <button type="button" className="secondary-btn" style={{ margin: 0, flex: 1 }} onClick={() => setContactForm({ open: false, birth: "", phone: "", loading: false })}>取消</button>
                      <button type="button" className="mini-btn" style={{ margin: 0, flex: 1 }} onClick={submitContactUpdate} disabled={contactForm.loading}>{contactForm.loading ? "處理中..." : "確認修改"}</button>
                    </div>
                  </>
                )}
              </div>
            ) : null}

            <button type="button" className="secondary-btn" onClick={resetAll}>返回主畫面</button>
          </div>
        );
      }

      function renderXray() {
        const check = xrayImage?.check;
        const department = XRAY_PARTS[xrayPart];
        const filter = `brightness(${xrayView.brightness}%) contrast(${xrayView.contrast}%)${xrayView.invert ? " invert(1)" : ""}`;
        return (
          <div className="form-card">
            <h3>🩻 X 光辨識器</h3>
            <div className="notice-box" style={{ padding: '14px 16px', marginBottom: '14px' }}>
              <p style={{ fontSize: '14px' }}>
                上傳或拍下 X 光片，系統會檢查影像是否像 X 光片、提供放大／亮度／反相檢視，並依拍攝部位建議掛號科別。
                <strong>本功能不會自動判讀骨折或病灶</strong>，影像判讀請以醫師為準；圖片只在你的裝置上處理，不會上傳。
              </p>
            </div>

            <label className="xray-upload">
              <input type="file" accept="image/*" capture="environment" onChange={handleXrayFile} />
              <span>{xrayImage ? "📷 換一張 X 光片" : "📷 上傳或拍攝 X 光片"}</span>
            </label>

            {xrayImage ? (
              <>
                <div className="xray-viewer">
                  <img src={xrayImage.url} alt="上傳的 X 光片" style={{ filter, transform: `scale(${xrayView.zoom})` }} />
                </div>

                {check ? (
                  <div className="xray-checks">
                    <div className={check.isGrayscale ? "xray-check ok" : "xray-check warn"}>
                      {check.isGrayscale ? "✅ 灰階影像，看起來像 X 光片" : "⚠️ 這是彩色照片，看起來不像 X 光片，請確認是否上傳正確"}
                    </div>
                    {check.lowContrast ? <div className="xray-check warn">⚠️ 影像對比偏低，建議在光線均勻處重拍，或用下方對比度調整</div> : null}
                    {check.tooSmall ? <div className="xray-check warn">⚠️ 解析度偏低（{check.width}×{check.height}），細節可能看不清楚</div> : null}
                  </div>
                ) : null}

                <div className="xray-controls">
                  <label>亮度 {xrayView.brightness}%
                    <input type="range" min="50" max="200" value={xrayView.brightness} onChange={(e) => setXrayView((v) => ({ ...v, brightness: Number(e.target.value) }))} />
                  </label>
                  <label>對比 {xrayView.contrast}%
                    <input type="range" min="50" max="250" value={xrayView.contrast} onChange={(e) => setXrayView((v) => ({ ...v, contrast: Number(e.target.value) }))} />
                  </label>
                  <label>放大 {xrayView.zoom.toFixed(1)}x
                    <input type="range" min="1" max="3" step="0.1" value={xrayView.zoom} onChange={(e) => setXrayView((v) => ({ ...v, zoom: Number(e.target.value) }))} />
                  </label>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <button type="button" className="ghost-btn" onClick={() => setXrayView((v) => ({ ...v, invert: !v.invert }))}>{xrayView.invert ? "取消反相" : "黑白反相"}</button>
                    <button type="button" className="ghost-btn" onClick={() => setXrayView({ brightness: 100, contrast: 100, invert: false, zoom: 1 })}>重設</button>
                  </div>
                </div>

                <label className="field-label">這張 X 光拍的是哪個部位？</label>
                <div className="body-legend" style={{ justifyContent: 'flex-start' }}>
                  {Object.keys(XRAY_PARTS).map((part) => (
                    <button type="button" key={part} className={`chip ${xrayPart === part ? "active" : ""}`} onClick={() => setXrayPart(part)}>{part}</button>
                  ))}
                </div>

                {department ? (
                  <div className="ai-booking-summary" style={{ marginTop: '14px' }}>
                    <div className="ai-booking-badge">🤖 依拍攝部位建議</div>
                    <div className="ai-booking-row"><span>建議骨科次專科</span><strong>{department}</strong></div>
                    <p className="helper-text" style={{ margin: '8px 0 0' }}>看診時記得帶著 X 光片（或光碟），讓醫師直接判讀。</p>
                  </div>
                ) : null}

                <button type="button" className="btn" onClick={bookFromXray} disabled={!department}>
                  {department ? `帶著這張 X 光掛${department}` : "請先選擇拍攝部位"}
                </button>
              </>
            ) : null}

            <button type="button" className="secondary-btn" onClick={resetAll}>返回主畫面</button>
          </div>
        );
      }

      function renderReminders() {
        const now = new Date();
        const dayKey = todayKey(now);
        const doneToday = reminderDone[dayKey] || [];
        const todays = reminders.filter((r) => r.enabled && r.days.includes(now.getDay()));
        return (
          <div className="form-card">
            <h3>⏰ 復健／用藥提醒</h3>
            <p className="helper-text" style={{ marginTop: 0 }}>
              提醒只存在這台裝置，不會上傳。網頁開著時，時間到會跳出提醒並語音播報；
              想要關掉網頁也能收到通知，請按下方「匯入手機行事曆」。
            </p>

            <div className="reminder-section">
              <h4>今天的待辦（{doneToday.filter((id) => todays.some((r) => r.id === id)).length}/{todays.length}）</h4>
              {todays.length === 0 ? (
                <div className="rag-empty" style={{ color: 'var(--muted)' }}>今天沒有排定的提醒。</div>
              ) : todays.map((r) => {
                const done = doneToday.includes(r.id);
                return (
                  <label key={r.id} className={`reminder-today ${done ? "done" : ""}`}>
                    <input type="checkbox" checked={done} onChange={() => toggleReminderDone(r.id)} />
                    <span className="reminder-time">{r.time}</span>
                    <span>{r.type === "med" ? "💊" : "🏃"} {r.title}</span>
                  </label>
                );
              })}
            </div>

            <div className="reminder-section">
              <h4>新增提醒</h4>
              <div className="reminder-type-row">
                <button type="button" className={`chip ${reminderForm.type === "med" ? "active" : ""}`} onClick={() => setReminderForm((f) => ({ ...f, type: "med" }))}>💊 用藥</button>
                <button type="button" className={`chip ${reminderForm.type === "rehab" ? "active" : ""}`} onClick={() => setReminderForm((f) => ({ ...f, type: "rehab" }))}>🏃 復健</button>
              </div>
              <label className="field-label">{reminderForm.type === "med" ? "藥名／劑量" : "復健項目"}</label>
              <input className="text-input" value={reminderForm.title} onChange={(e) => setReminderForm((f) => ({ ...f, title: e.target.value }))}
                placeholder={reminderForm.type === "med" ? "例如：消炎止痛藥 1 顆（飯後）" : "例如：直膝抬腿 10 下 × 3 組"} />
              <label className="field-label">提醒時間</label>
              <input className="text-input" type="time" value={reminderForm.time} onChange={(e) => setReminderForm((f) => ({ ...f, time: e.target.value }))} />
              <label className="field-label">重複（星期）</label>
              <div className="reminder-days">
                {WEEKDAY_SHORT.map((label, day) => (
                  <button type="button" key={day} className={`day-btn ${reminderForm.days.includes(day) ? "active" : ""}`} onClick={() => toggleFormDay(day)}>{label}</button>
                ))}
              </div>
              <label className="field-label">備註（選填）</label>
              <input className="text-input" value={reminderForm.note} onChange={(e) => setReminderForm((f) => ({ ...f, note: e.target.value }))} placeholder="例如：配溫開水、運動前先熱敷" />
              <button type="button" className="btn" onClick={() => { if (addReminder()) setToast("已新增提醒"); }}>＋ 新增提醒</button>
            </div>

            <div className="reminder-section">
              <h4>所有提醒（{reminders.length}）</h4>
              {reminders.length === 0 ? (
                <div className="rag-empty" style={{ color: 'var(--muted)' }}>還沒有提醒，可以從上方新增，或到「復健影片教學」一鍵加入。</div>
              ) : reminders.map((r) => (
                <div key={r.id} className={`reminder-item ${r.enabled ? "" : "off"}`}>
                  <div>
                    <div className="reminder-item-title">{r.type === "med" ? "💊" : "🏃"} {r.title}</div>
                    <div className="reminder-item-meta">
                      {r.time}．{r.days.length === 7 ? "每天" : `每週${r.days.map((d) => WEEKDAY_SHORT[d]).join("、")}`}{r.note ? `．${r.note}` : ""}
                    </div>
                  </div>
                  <div className="reminder-item-actions">
                    <button type="button" className="ghost-btn" onClick={() => toggleReminderEnabled(r.id)}>{r.enabled ? "暫停" : "啟用"}</button>
                    <button type="button" className="ghost-btn danger" onClick={() => deleteReminder(r.id)}>刪除</button>
                  </div>
                </div>
              ))}
            </div>

            <div className="reminder-section" style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              {notifyPermission === "default" ? (
                <button type="button" className="mini-btn" style={{ flex: 1 }} onClick={requestNotifyPermission}>🔔 開啟瀏覽器通知</button>
              ) : null}
              <button type="button" className="mini-btn" style={{ flex: 1 }} onClick={downloadReminderIcs}>📅 匯入手機行事曆（.ics）</button>
            </div>
            {notifyPermission === "denied" ? <p className="helper-text">瀏覽器通知已被封鎖，提醒時只會在畫面跳出並語音播報；可到瀏覽器網站設定重新允許。</p> : null}

            <button type="button" className="secondary-btn" onClick={resetAll}>返回主畫面</button>
          </div>
        );
      }

      function renderRehab() {
        const list = rehabPart === "全部" ? REHAB_EXERCISES : REHAB_EXERCISES.filter((x) => x.part === rehabPart);
        return (
          <div className="form-card">

            <p className="helper-text" style={{ marginTop: 0 }}>常見骨科居家復健動作。開始前請先確認醫師或物理治療師同意，運動中若疼痛明顯加劇、麻木或腫脹請立即停止。</p>
            <div className="body-legend" style={{ justifyContent: 'flex-start' }}>

              ))}

                      <span className="rehab-name">{ex.name}</span>
                      <span className="rehab-arrow">{open ? "▲" : "▼"}</span>

                      <div className="rehab-body">

                          <div className="rehab-video">

                        <ol className="rehab-steps">{ex.steps.map((st, i) => <li key={i}>{st}</li>)}</ol>

                        </div>
                      </div>
                    ) : null}
                  </div>
                );
              })}
            </div>
            <button type="button" className="secondary-btn" onClick={resetAll}>返回主畫面</button>
          </div>
        );

                  <span className="intent-title">就診紀錄／修改預約</span>
                  <span className="intent-desc">上次就診紀錄、改期、改醫師、取消、修改聯絡手機</span>
                </button>
              </div>
              <div className="intent-options intent-options-grid">
                <button type="button" className="intent-btn" onClick={() => goToFeature(STATES.XRAY, "請上傳或拍攝 X 光片")}>
                  <span className="intent-emoji">🩻</span>
                  <span className="intent-title">X 光辨識器</span>
                  <span className="intent-desc">檢視 X 光片，依部位建議科別</span>
                </button>
                <button type="button" className="intent-btn" onClick={() => goToFeature(STATES.REMINDERS, "設定復健與用藥提醒")}>
                  <span className="intent-emoji">⏰</span>
                  <span className="intent-title">復健／用藥提醒</span>
                  <span className="intent-desc">定時提醒吃藥、做復健</span>
                </button>
                <button type="button" className="intent-btn" onClick={() => goToFeature(STATES.REHAB, "居家復健動作教學")}>
                  <span className="intent-emoji">🎬</span>
                  <span className="intent-title">復健影片教學</span>
                  <span className="intent-desc">各部位居家復健動作示範</span>
                </button>
              </div>
              <div className="intent-voice-hint">
                <button type="button" className={`mic-btn ${recording ? "recording" : ""}`} onClick={recording ? stopRecord : startRecord}>{recording ? "停止錄音" : "開始語音"}</button>
                <p className="helper-text">也可以直接說「我肩膀痛」或「我要掛高醫師」，AI 會自動幫你判斷。</p>
                {voiceFailCount >= VOICE_FAIL_THRESHOLD ? (<p className="voice-fallback-hint">🎙️→⌨️ 已自動切換成文字輸入，請直接在下方打字。</p>) : null}
                {lastInputEcho ? (<div className="input-echo"><span className="echo-label">最近輸入：</span><span className="echo-text">{lastInputEcho}</span></div>) : null}
                <div className="input-row">
                  <input className="text-input" ref={textInputRef} value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="或直接輸入症狀／科別／醫師姓名" onKeyDown={(e) => { if (e.key === "Enter") submitManualInput(); }} />
                  <button type="button" className="mini-btn" onClick={submitManualInput}>送出</button>
                </div>
              </div>
            </div>
          );
        }

        if (state === STATES.SELECT_BODY_PART) {
          return (
            <>
              <div className="body-select-card">
                <div className="section-title">請點擊人體圖上的骨骼關節不適部位</div>
                <p className="body-select-subtitle">也可以直接輸入症狀，例如：肩膀痛、膝蓋痛、腰痛</p>
                {renderBodyDiagram()}
              </div>
              <div style={{ marginTop: "14px" }}>
                <button type="button" className="secondary-btn" onClick={() => analyzeSymptom("症狀不明確")}>無法確定不適部位</button>
              </div>
              <div className="link-row">
                <button type="button" className="link-btn" onClick={startDirectBooking}>⏩ 直接選次專科掛號</button>
                <span className="link-sep">・</span>
                <button type="button" className="link-btn" onClick={resetAll}>⬅ 回主畫面</button>
              </div>
              <div style={{ marginTop: "26px" }}>{renderSymptomInput()}</div>
            </>
          );
        }

        if (state === STATES.QA) {
          return (
            <>
              <div className="form-card">
                {renderQaProgress()}
                <h3>{prompt}</h3>
                {lastInputEcho ? (<div className="input-echo"><span className="echo-label">最近輸入：</span><span className="echo-text">{lastInputEcho}</span></div>) : null}
                {renderQuickOptions()}
                <div className="input-row">
                  <input className="text-input" ref={textInputRef} value={inputValue} onChange={(e) => setInputValue(e.target.value)} placeholder="請輸入你的回答" onKeyDown={(e) => { if (e.key === "Enter") submitManualInput(); }} />
                  <button type="button" className="mini-btn" onClick={submitManualInput}>送出</button>
                </div>

                <div style={{ display: 'flex', gap: '10px', marginTop: '18px' }}>
                  <button type="button" className="secondary-btn" style={{ margin: 0, flex: 1 }} onClick={goBackQa}>
                    ⬅ 上一步
                  </button>
                  <button type="button" className={`mini-btn ${recording ? "recording" : ""}`} style={{ margin: 0, flex: 1.5, padding: '14px' }} onClick={recording ? stopRecord : startRecord}>
                    {recording ? "🛑 停止錄音" : "🎙 語音回答"}
                  </button>
                </div>
              </div>
            </>
          );
        }

        if (state === STATES.ALERT) {
          return (
            <>
              <div className="alert-box">
                <h3>⚠ 緊急提醒</h3>
                <p>{alertMessage}</p>
                <p className="alert-disclaimer">本系統僅供骨科初步分流，若症狀持續惡化請立即就醫。</p>
              </div>
              <button type="button" className="secondary-btn" onClick={resetAll}>重新開始</button>
            </>
          );
        }

        if (state === STATES.NON_ORTHO_SUGGESTION) {
          return (
            <>
              <div className="notice-box">
                <h3>💡 溫馨提醒</h3>
                <p>您描述的「{nonOrthoText}」聽起來可能不屬於骨科範圍，建議您優先考慮掛「<strong>{nonOrthoDept}</strong>」門診評估。</p>
                <p className="alert-disclaimer">本系統僅提供骨科掛號服務，非醫療診斷；若同時有骨骼關節問題，歡迎繼續使用本系統掛號。</p>
              </div>
              <div style={{ display: 'flex', gap: '10px', marginTop: '16px' }}>
                <button type="button" className="secondary-btn" style={{ margin: 0, flex: 1 }} onClick={resetAll}>返回主畫面</button>
                <button type="button" className="btn" style={{ margin: 0, flex: 1 }} onClick={() => analyzeSymptom(nonOrthoText)}>我還是要繼續骨科問診</button>
              </div>
            </>
          );
        }

        if (state === STATES.RESULT) {
          return (
            <>
              <div className="result-card summary-card">
                <h4>初步分流結果</h4>
                <p>根據您的症狀，系統建議優先掛號骨科：<strong> {result[0]?.[0] || "脊椎外科"} </strong></p>
              </div>
              <div className="result-card">
                <h4>推薦次專科</h4>
                {result.map((item, idx) => {
                  const department = Array.isArray(item) ? item[0] : item;
                  const score = Array.isArray(item) ? item[1] : 80;
                  const percent = Math.min(100, Math.round((score / 80) * 100));
                  return (
                    <div className="confidence" key={department}>
                      <div className="confidence-row">
                        <span className="confidence-label">#{idx + 1} {department}</span>
                        <span className="confidence-value">{percent}%</span>
                      </div>
                      <div className="confidence-bar"><div className="confidence-bar-fill" style={{ width: `${percent}%` }} /></div>
                    </div>
                  );
                })}
              </div>
              {renderRagSection()}
              <button type="button" className="btn" onClick={() => {
                setPrompt("AI 已完成推薦，請填寫基本資料完成掛號");
                speak("問診完成，AI 已為您安排門診，請填寫基本資料");
                setState(STATES.PATIENT_INFO);
              }}>✅ AI 已安排好門診，一鍵前往確認</button>

              <button type="button" className="secondary-btn" onClick={goBackQa}>
                上一步（修改症狀回答）
              </button>
            </>
          );
        }

        if (state === STATES.PATIENT_INFO) {
          return (
            <div className="form-card">
              <h3>填寫基本資料，AI 幫您完成剩下的事</h3>
              <div className="patient-info-mic">
                <p className="patient-voice-hint">可直接用語音一次說出姓名、身分證字號、生日與手機號碼，AI 會自動幫您填入欄位。</p>
                <button type="button" className={`mic-btn ${recordingPatientInfo ? "recording" : ""}`} onClick={recordingPatientInfo ? stopPatientInfoRecord : startPatientInfoRecord}>{recordingPatientInfo ? "停止語音輸入" : "語音填寫資料"}</button>
              </div>
              {patientVoiceNeedsReview ? (
                <div className="patient-voice-review">
                  <p><strong>🤖 AI 已自動辨識並填入以下內容：</strong></p>
                  <span className="raw">{lastPatientVoiceTranscript}</span>
                  <div className="review-actions"><button type="button" className="mini-btn" onClick={confirmPatientVoiceReview}>看起來沒問題</button></div>
                </div>
              ) : null}
              <label className="field-label">姓名</label>
              <input className="text-input" name="name" value={patientInfo.name} onChange={handlePatientInfoChange} />
              <label className="field-label">身分證字號</label>
              <input className="text-input" name="idNumber" value={patientInfo.idNumber} onChange={handlePatientInfoChange} />
              <label className="field-label">生日</label>
              <input className="text-input" name="birth" value={patientInfo.birth} onChange={handlePatientInfoChange} placeholder="YYYY/MM/DD" />
              <label className="field-label">手機</label>
              <input className="text-input" name="phone" value={patientInfo.phone} onChange={handlePatientInfoChange} />

              {renderBookingSummary()}

              <button type="button" className="btn" onClick={confirmBookingAll} disabled={isSubmittingBooking}>
                {isSubmittingBooking ? "掛號處理中..." : "✅ 確認掛號"}
              </button>

              <button type="button" className="secondary-btn" onClick={() => {
                if (isDirectBooking) {
                  resetAll();
                } else {
                  setPrompt("這是您的初步分流推薦");
                  speak("返回分流推薦結果");
                  setState(STATES.RESULT);
                }
              }}>
                上一步
              </button>
            </div>
          );
        }

        if (state === STATES.COMPLETE) {
          return (
            <>
              <div className="success">🎉 掛號手續已完成！</div>
              <div className="result-card summary-card" style={{ border: '2px dashed #4caf50', backgroundColor: '#f9fff9', padding: '20px' }}>
                <h4 style={{ color: '#2e7d32', textAlign: 'center', marginBottom: '15px' }}>預約成功證明</h4>
                <p><strong>姓名：</strong> {patientInfo.name}</p>
                <p><strong>骨科次專科：</strong> {booking.department}</p>
                <p><strong>醫師：</strong> {booking.doctor}</p>
                <p><strong>日期：</strong> {booking.date}</p>
                <p><strong>時間：</strong> {booking.slot}</p>

                <div style={{ marginTop: '20px', paddingTop: '15px', borderTop: '1px solid #c8e6c9', textAlign: 'center' }}>
                  <p style={{ fontSize: '0.9em', color: '#555', margin: 0 }}>📌 請截圖保存此畫面，並於看診當日提早 10 分鐘報到。</p>
                </div>
              </div>
              <button type="button" className="secondary-btn" onClick={resetAll} style={{ marginTop: '20px' }}>確認並回首頁</button>
            </>
          );
        }

        if (state === STATES.CHECK_HISTORY) {
          return renderCheckHistory();
        }

        if (state === STATES.XRAY) return renderXray();
        if (state === STATES.REMINDERS) return renderReminders();
        if (state === STATES.REHAB) return renderRehab();

        return renderDefaultInput();
      }

      return (
        <div className="app">
          <div className="header">
            <div className="assistant">🦴</div>
            <div className="header-copy">
              <div className="eyebrow">Orthopedic Smart Voice Triage + RAG</div>
              <h2>骨科智慧語音掛號助理</h2>
              <p className="prompt">{prompt}</p>
            </div>
          </div>
          {activeReminder ? (
            <div className="reminder-alert" role="alert">
              <div>
                <strong>{activeReminder.type === "med" ? "💊 用藥時間到了" : "🏃 復健時間到了"}</strong>
                <div>{activeReminder.title}{activeReminder.note ? `（${activeReminder.note}）` : ""}</div>
              </div>
              <div className="reminder-alert-actions">
                <button type="button" className="mini-btn" onClick={() => toggleReminderDone(activeReminder.id)}>✅ 完成了</button>
                <button type="button" className="ghost-btn" onClick={() => setActiveReminder(null)}>稍後</button>
              </div>
            </div>
          ) : null}
          {renderContent()}
          {toast ? <div className="toast" role="status">{toast}</div> : null}
          <div className="footer-note">
            本介面為前端示意版，非醫療診斷；若有肢體劇痛、明顯變形、骨頭外露、下肢麻木無力或大小便失禁等急症，請立即就醫或撥打 119。
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
